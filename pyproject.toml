[project]
name = "vulnem"
version = "0.1.0"
description = "VulnEm — autonomous AI penetration-testing agent for authorized security testing"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["security", "pentest", "agent", "ai", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]

dependencies = [
  "litellm>=1.60",
  "pydantic>=2.7",
  "docker>=7.1",
  "rich>=13.7",
  "requests>=2.32",
  "textual>=0.60",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
vulnem = "vulnem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vulnem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501", # long lines in prompts/skills strings
]
