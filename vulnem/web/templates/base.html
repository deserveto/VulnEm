<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VulnEm — authorized security scanning: browse runs, watch scans live, read reports.">
  <title>{% block title %}VulnEm{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0A'/%3E%3Ctext x='16' y='23' font-family='Courier New,monospace' font-size='17' font-weight='700' fill='%23FAFAFA' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    try {
      if (localStorage.getItem("vulnem-theme") === "dark")
        document.documentElement.dataset.theme = "dark";
    } catch (e) { /* private mode etc. — stay light */ }
  </script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>VulnEm</a>
  <div class="topbar-right">
    <nav aria-label="Main">
      <a href="/scan"{% if request.url.path.startswith("/scan") %} class="active" aria-current="page"{% endif %}>New scan</a>
      <a href="/"{% if request.url.path == "/" %} class="active" aria-current="page"{% endif %}>Runs</a>
      <a href="/setup"{% if request.url.path.startswith("/setup") %} class="active" aria-current="page"{% endif %}>Setup</a>
    </nav>
    <button type="button" id="theme-toggle" class="theme-toggle"
            aria-label="Switch to dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <path d="M21.7519 15.0021C20.597 15.484 19.3296 15.7501 18 15.7501C12.6152 15.7501 8.25 11.3849 8.25 6.00011C8.25 4.67052 8.51614 3.40308 8.99806 2.24817C5.47566 3.71798 3 7.19493 3 11.2501C3 16.6349 7.36522 21.0001 12.75 21.0001C16.8052 21.0001 20.2821 18.5245 21.7519 15.0021Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <path d="M12 3V5.25M18.364 5.63604L16.773 7.22703M21 12H18.75M18.364 18.364L16.773 16.773M12 18.75V21M7.22703 16.773L5.63604 18.364M5.25 12H3M7.22703 7.22703L5.63604 5.63604M15.75 12C15.75 14.0711 14.0711 15.75 12 15.75C9.92893 15.75 8.25 14.0711 8.25 12C8.25 9.92893 9.92893 8.25 12 8.25C14.0711 8.25 15.75 9.92893 15.75 12Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>
<main id="main">
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
<script src="/static/theme.js"></script>
</body>
</html>
