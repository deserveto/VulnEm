# Optional persistent lab for browsing/manual testing alongside `vulnem scan`.
# The demo command creates its own throwaway lab; this one stays up.
#
#   docker compose -p vulnem-lab -f lab/docker-compose.yml up -d
#   vulnem scan http://juice-shop:3000 --network vulnem-lab_labnet
#   vulnem scan http://dvwa --network vulnem-lab_labnet --creds lab/dvwa-creds.json
#   docker compose -p vulnem-lab -f lab/docker-compose.yml down
#
# Two stacks on purpose: Juice Shop (Node/Angular) and DVWA (PHP) prove the
# skills and tools generalize across technology stacks.

services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    # Browsable from the host at http://localhost:3000 (default network),
    # while the sandbox attaches to the internal lab network only.
    # Juice Shop is fragile under aggressive probing — self-heal.
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks: [default, labnet]

  dvwa:
    image: vulnerables/web-dvwa:latest
    # Browsable from the host at http://localhost:4280 (first visit: click
    # "Create / Reset Database"; login admin/password).
    restart: unless-stopped
    ports:
      - "127.0.0.1:4280:80"
    networks: [default, labnet]

  vuln-app:
    build: ./vulnapp
    # VulnEm's own vulnerable app: stdlib-only Python with PLANTED flaws
    # (SQLi, reflected XSS, path traversal, command injection, secret leak).
    # Source ships in lab/vulnapp — mount it with `vulnem scan --source
    # lab/vulnapp` for white-box runs; ground truth in
    # evals/ground_truth/vuln-app.json.
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    networks: [default, labnet]

networks:
  labnet:
    internal: true
