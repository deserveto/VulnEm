name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check vulnem/ tests/ scripts/
      - run: pytest tests/ -q

  # Phase 4 exit criteria: run VulnEm against this repo's own lab, keylessly
  # (scripted engine — the mock e2e path), and verify the CI contract:
  # findings are filed, SARIF/PDF are produced, and the scan exits 1
  # (fail-on-findings). The job is green only when VulnEm *would* fail the PR.
  pr-check:
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install VulnEm
        run: pip install -e .
      - name: Build the sandbox image
        run: vulnem build
      - name: Keyless scan of the lab (scripted engine) + contract assertions
        run: python scripts/mock_e2e.py
      - name: Verify CI report artifacts + upload run dir
        shell: bash
        run: |
          set -euo pipefail
          run_dir=$(ls -dt runs/*juice-shop* | head -1)
          test -f "$run_dir/findings.sarif"
          test -f "$run_dir/report.pdf"
          results=$(python -c "import json;print(len(json.load(open('$run_dir/findings.sarif'))['runs'][0]['results']))")
          if [ "$results" -lt 1 ]; then
            echo "FAIL: scan filed no findings — the fail-on-findings contract cannot hold"; exit 1
          fi
          echo "pr-check OK: $results findings in SARIF; a real CI scan would exit 1"
          echo "RUN_DIR=$run_dir" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnem-run
          path: ${{ env.RUN_DIR }}
          retention-days: 7
